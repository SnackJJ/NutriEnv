[project]
name = "nutrienv"
version = "1.1.1"
description = "Interactive USDA-FNDDS environment and 63-task benchmark for LLM dietary agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrienv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["archive"]

[tool.pyright]
venvPath = "."
venv = ".venv"
